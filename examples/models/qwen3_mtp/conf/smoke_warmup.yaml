# Smoke test: MTP Warmup — quick 5-iteration test
model:
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.3
  tensor_model_parallel_size: 1

train:
  train_iters: 5
  global_batch_size: 32
  micro_batch_size: 1

optimizer:
  lr: 0.0001
  min_lr: 0.00001

scheduler:
  lr_warmup_iters: 2
  lr_decay_style: cosine

logger:
  log_interval: 1

checkpoint:
  save_interval: 5
  save: /mnt/weka/aisg/ckpt/mb/mtp/mtp4/warmup
  load: /mnt/weka/aisg/ckpt/mb/mtp/mtp4/warmup
