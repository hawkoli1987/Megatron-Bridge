# Phase 2: Joint Training — all parameters unfrozen.
# Use with: --pretrained-checkpoint /path/to/warmup/checkpoint

model:
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.1

train:
  train_iters: 5000
  global_batch_size: 32
  micro_batch_size: 1

optimizer:
  lr: 0.00005
  min_lr: 0.000005

scheduler:
  lr_warmup_iters: 100
  lr_decay_style: cosine

logger:
  log_interval: 10

checkpoint:
  save_interval: 1000
