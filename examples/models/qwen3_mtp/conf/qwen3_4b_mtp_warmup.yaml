# Phase 1: MTP Warmup — backbone frozen, only MTP layers train.
# Use with: --hf-pretrained-checkpoint Qwen/Qwen3-4B --freeze-non-mtp

model:
  mtp_num_layers: 1
  mtp_loss_scaling_factor: 0.3

train:
  train_iters: 2500
  global_batch_size: 32
  micro_batch_size: 1

optimizer:
  lr: 0.0001
  min_lr: 0.00001

scheduler:
  lr_warmup_iters: 100
  lr_decay_style: cosine

logger:
  log_interval: 10

checkpoint:
  save_interval: 500
